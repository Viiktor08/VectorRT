# Laboratorio aislado de VectorRT (Fase 0).
# Red interna sin salida a internet: los contenedores solo se ven entre sí.

networks:
  vectorrt-lab:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.10.10.0/24
  # Red no interna, solo para publicar el puerto de la API hacia el host.
  # Docker no publica puertos de contenedores que solo están en una red
  # `internal: true`, así que el backend necesita esta segunda pata.
  vectorrt-api:
    driver: bridge

services:
  ssh-target:
    build: ./targets/ssh-target
    container_name: ssh-target
    networks:
      vectorrt-lab:
        ipv4_address: 10.10.10.10

  web-target:
    build: ./targets/web-target
    container_name: web-target
    networks:
      vectorrt-lab:
        ipv4_address: 10.10.10.11

  multi-target:
    build: ./targets/multi-target
    container_name: multi-target
    networks:
      vectorrt-lab:
        ipv4_address: 10.10.10.12

  attacker:
    build: ./attacker
    container_name: attacker
    stdin_open: true
    tty: true
    networks:
      vectorrt-lab:
        ipv4_address: 10.10.10.20

  backend:
    build:
      context: ../backend
    container_name: backend
    # nmap -sS e hping3 necesitan poder abrir sockets raw.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - LOG_LEVEL=INFO
      - VECTORRT_USERNAME=${VECTORRT_USERNAME:-admin}
      - VECTORRT_PASSWORD=${VECTORRT_PASSWORD:-changeme}
      - VECTORRT_SECRET_KEY=${VECTORRT_SECRET_KEY:-dev-secret-change-me}
    volumes:
      - ../backend/app:/app/app
      - ../backend/data:/app/data
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks:
      vectorrt-lab:
        ipv4_address: 10.10.10.30
      vectorrt-api: {}
